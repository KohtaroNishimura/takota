[project]
name = "takota-people-flow"
version = "0.1.0"
description = "Person flow analytics on Raspberry Pi 5 using ATOMS3RM12 stream and YOLO11."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lap>=0.5.13",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
headless = [
    "opencv-python-headless>=4.9",
]

[project.scripts]
takota-people-flow = "takota_people_flow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/takota_people_flow"]

[tool.uv]
package = true
